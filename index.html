<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Damir Sarsengaliyev</title>
  <meta name="description" content="Damir Sarsengaliyev — data scientist at Freedom Holding Corp., working on statistics, ML, and LLMs.">
  <meta name="theme-color" content="#0b5f62">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <svg class="decor decor-arcs" viewBox="0 0 400 400" aria-hidden="true">
    <circle cx="400" cy="400" r="380"></circle>
    <circle cx="400" cy="400" r="330"></circle>
    <circle cx="400" cy="400" r="280"></circle>
  </svg>
  <div class="decor decor-hatch" aria-hidden="true"></div>

  <main id="stage" aria-label="Interactive graph. Use arrow keys to move between nodes.">
    <div id="world">
      <svg id="edges" width="1" height="1" aria-hidden="true">
        <g id="edge-layer"></g>
        <path id="ghost-path" pathLength="1"></path>
        <path id="charge-path" pathLength="1"></path>
      </svg>
      <div id="ghost" aria-hidden="true">
        <div class="ghost-ring"></div>
        <div class="ghost-tag"><b></b><span></span></div>
      </div>
      <div id="traveler" aria-hidden="true"></div>
      <div id="nodes"></div>
    </div>
  </main>

  <svg id="beam" aria-hidden="true">
    <defs>
      <linearGradient id="beam-grad" gradientUnits="userSpaceOnUse">
        <stop offset="0" class="beam-stop-a"></stop>
        <stop offset="1" class="beam-stop-b"></stop>
      </linearGradient>
    </defs>
    <polygon id="beam-cone"></polygon>
    <line id="beam-l1"></line>
    <line id="beam-l2"></line>
  </svg>

  <section id="panel" aria-live="polite">
    <div class="scan" aria-hidden="true"></div>
    <div class="panel-scroll"></div>
  </section>

  <header class="topbar ui">
    <a class="brand" href="#/">Damir Sarsengaliyev</a>
    <nav class="crumbs" aria-label="Breadcrumb"></nav>
  </header>

  <nav class="quick ui" aria-label="Quick links">
    <a href="https://github.com/Gunterwill" target="_blank" rel="noopener">GitHub</a>
    <a href="https://www.linkedin.com/in/damir-sarsengaliyev-843816254/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="mailto:damir.sarsengaliyev.03@gmail.com">Email</a>
    <a href="cv.pdf" target="_blank" rel="noopener">CV</a>
  </nav>

  <button class="edge-hint up ui" type="button"></button>
  <button class="edge-hint left ui" type="button"></button>
  <button class="edge-hint right ui" type="button"></button>

  <div class="hint ui" aria-hidden="true">
    <span class="hint-desktop">Hold and drag toward a node, or click it · arrow keys work too</span>
    <span class="hint-touch">Swipe toward a node, or tap it</span>
  </div>

  <noscript>
    <div class="noscript">
      <h1>Damir Sarsengaliyev</h1>
      <p>Data scientist working on statistics, machine learning, and LLMs.</p>
      <p><a href="https://github.com/Gunterwill">GitHub</a> · <a href="mailto:damir.sarsengaliyev.03@gmail.com">Email</a> · <a href="cv.pdf">CV</a></p>
    </div>
  </noscript>

  <script src="content.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
